name: Deploy

# Only `production` ships to GitHub Pages.
on:
  push:
    branches: [production]
  workflow_dispatch: # allow manual re-deploy from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Tag dated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          d=$(date -u +%Y.%m.%d)
          n=1
          while git rev-parse "v$d.$n" >/dev/null 2>&1; do n=$((n+1)); done
          tag="v$d.$n"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes "https://commongrounddavis.com"
